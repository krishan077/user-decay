<div class="mb-8 flex  items-start justify-between gap-4">
    <div>
        <h1 class="text-3xl mb-2">Monet</h1>
    </div>

    <div class="flex items-center gap-2">
        <p>{{company_name}}</p>
        <button (click)="showLogoutDialog = true"
            class="bg-red-500 hover:bg-red-600 text-white py-1 px-2 cursor-pointer rounded-lg">
            Logout
        </button>
    </div>

</div>

@if(showLogoutDialog) {
<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-md mx-4">
        <h3 class="text-lg font-semibold mb-2">
            Logout Confirmation
        </h3>

        <p class="text-slate-600 mb-6">
            Are you sure you want to logout?
        </p>

        <div class="flex justify-end gap-3">
            <button (click)="showLogoutDialog = false"
                class="px-4 py-2 border border-slate-300 rounded-lg hover:bg-slate-100 cursor-pointer">
                Cancel
            </button>

            <button (click)="confirmLogout()"
                class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 cursor-pointer">
                Logout
            </button>
        </div>
    </div>
</div>
}
